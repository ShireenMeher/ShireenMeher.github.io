  - name: "Dodo (Job Application Tracker Chrome Extension)"
    url: "https://github.com/ShireenMeher/job-application-tracker"
    dates: "Jun 2026 - Aug 2026"
    languages: ["JavaScript"]
    tech_stack: ["Chrome Extension (Manifest V3)", "Google Sheets API v4", "Gmail API", "chrome.identity OAuth", "chrome.storage", "chrome.alarms", "chrome.webRequest", "MutationObserver"]
    concepts:
      - "Browser extension development (MV3 service worker + content scripts)"
      - "DOM mutation observation for SPA state detection"
      - "Heuristic detection (keyword co-occurrence, form-submit classification) to avoid false positives"
      - "Network-level request interception as a stronger detection signal (Ashby GraphQL submit calls)"
      - "OAuth 2.0 via chrome.identity"
      - "Offline queueing with retry-on-alarm (chrome.storage.local + chrome.alarms)"
      - "Idempotent writes / duplicate detection (job ID + URL based)"
      - "Cross-service data reconciliation (Gmail inbox to Sheets rows) with tiered, confidence-based matching and explicit skip-if-ambiguous behavior"
      - "Google Sheets API programmatic formatting (frozen headers, column widths, cell styling)"
      - "Regex-based ID/entity extraction across multiple ATS URL schemes (Greenhouse, Lever, Ashby, Workday, Indeed, LinkedIn)"
      - "Request concurrency control (small worker pool) and exponential backoff with jitter for rate-limited APIs"
    summary: >
      "Dodo" is a Chrome extension (Manifest V3) that automatically detects job application
      submissions on LinkedIn, Handshake, and arbitrary company career/ATS sites (Greenhouse,
      Lever, Ashby, Workday, iCIMS, SmartRecruiters, BambooHR, Jobvite, Workable), then logs
      them to a Google Sheet via the Sheets API v4, authenticated through chrome.identity OAuth.
      Detection is layered: site-specific content scripts watch for confirmation DOM changes via
      MutationObserver (LinkedIn Easy Apply, Handshake), a generic heuristic detector uses
      keyword co-occurrence scoring plus application-form classification (excluding
      login/OTP/search forms) for arbitrary career pages, and for Ashby specifically a
      chrome.webRequest listener detects the actual GraphQL submit-application network call as a
      stronger, DOM-independent signal. A background service worker persists entries locally,
      writes to Sheets with offline queueing and retry via chrome.alarms if the write fails, and
      deduplicates by job ID or URL so page refreshes don't create duplicate rows. A separate
      Gmail integration (read-only OAuth scope) scans the inbox every 24 hours for status-update
      emails (rejection, interview, assessment, offer), classifies them by keyword, and
      reconciles them against existing Sheet rows using a tiered matching strategy — exact job-ID
      match first, then unambiguous single-company match, then role-text-overlap scoring for
      multiple open applications at the same company — explicitly skipping rather than guessing
      when a match is ambiguous, and never creating new rows from email alone. Job/requisition
      IDs are extracted via regex across multiple ATS URL formats (Greenhouse, Lever, Ashby,
      Workday, Indeed, LinkedIn) so the same posting can be recognized from both the page URL and
      later from an email. Includes a popup UI for manual logging and on-demand Gmail scans, a
      floating on-page counter widget, and programmatic Sheet formatting (frozen header row,
      column widths, cell styling) applied once. Demonstrates real product engineering judgment:
      layered/tiered detection with fallbacks, explicit handling of ambiguity (skip rather than
      guess), offline resilience (local queueing, retry), rate-limit-aware API usage (backoff with
      jitter, bounded concurrency), and OAuth-secured integration with two separate Google APIs.

  - name: "BestFit"
    url: "https://github.com/ShireenMeher/bestfit"
    dates: "Jun 2026 - Aug 2026"
    languages: ["Python"]
    tech_stack: ["Anthropic Claude API", "Pydantic", "PyYAML", "pytest"]
    concepts:
      - "LLM application design (structured JSON output, schema validation)"
      - "Retry-on-validation-failure patterns for unreliable LLM output"
      - "Agentic tool use (Claude's server-side web_fetch tool)"
      - "CLI tool design"
      - "Test-driven development with fake/mocked LLM clients"
    summary: >
      A local CLI tool that evaluates a batch of job postings against a candidate's resume and
      GitHub project inventory using the Claude API, ranking jobs by fit and selecting the best
      3 supporting projects per role with individual relevance scores. Built with strict JSON
      schema validation (Pydantic), automatic retry with error feedback when Claude returns
      invalid output or invents a project name, and Claude's native web_fetch tool for reading
      job posting URLs rather than any custom scraping code. Fully covered by pytest using a
      fake Claude client, with no network calls required for the test suite. Demonstrates
      practical experience building reliable systems around LLM calls: schema enforcement,
      hallucination guardrails, and graceful failure handling.
