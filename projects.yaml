# Your GitHub project inventory.
# Edit this by hand whenever you add/change a project — no API sync.
# "name" MUST be unique — Claude is required to reference projects by this
# exact name, and the tool rejects any response that invents a name not listed here.

projects:
  - name: "Distributed Workflow Orchestrator"
    url: "https://github.com/ShireenMeher/distributed-workflow-orchestrator"
    languages: ["Go"]
    tech_stack: ["PostgreSQL", "Docker", "Docker Compose", "Chi router", "pgxpool"]
    concepts:
      - "DAG scheduling"
      - "Distributed task orchestration"
      - "Worker leases"
      - "Heartbeats"
      - "Crash detection and recovery"
      - "Exponential backoff retry"
      - "Cascade failure propagation"
      - "Stateless scheduler design"
      - "SELECT ... FOR UPDATE SKIP LOCKED (Postgres as queue, no external broker)"
      - "Concurrency without distributed locks"
      - "Event sourcing / append-only audit log"
      - "Task status state machine"
      - "Microservices (API/Scheduler/Worker as independent binaries)"
    summary: >
      A production-style DAG workflow orchestration engine in Go, inspired by Temporal, Airflow,
      and AWS Step Functions. Three independent stateless binaries (API server, Scheduler, Worker)
      share a single PostgreSQL database as the central queue, using SELECT FOR UPDATE SKIP LOCKED
      to let workers claim tasks concurrently without an external message broker or distributed
      locks, eliminating an entire class of infrastructure and preventing double-execution.
      Implements worker leases and heartbeats for crash detection, exponential backoff retry,
      cascade failure propagation (marking downstream dependents SKIPPED), and a fully stateless
      scheduler that resumes correctly after a restart purely from database state. Supports HTTP,
      SHELL, DELAY, and WEBHOOK task types, with a REST API (Chi router), a scheduler loop that
      identifies ready tasks via correlated NOT EXISTS subqueries over a DAG edge table, and an
      append-only event log capturing every state transition for auditability. Deployed via Docker
      Compose with a multi-stage Dockerfile. Directly demonstrates distributed systems design,
      concurrency control, fault tolerance, and infrastructure/backend engineering at a level
      comparable to production workflow orchestration systems.

  - name: "Distributed Stock Trading Platform"
    url: "https://github.com/ShireenMeher/distributed_stock_trading_platform"
    languages: ["Python", "Shell", "Dockerfile"]
    tech_stack: ["Docker", "Docker Compose", "ThreadPoolExecutor", "LRU Cache", "REST APIs"]
    concepts:
      - "Paxos consensus (Proposer, Acceptor, Learner roles)"
      - "Leader election and automatic re-election on crash"
      - "Replication across multiple replica nodes"
      - "Fault tolerance and failure simulation (leader kill, replica failure, mid-trade partition)"
      - "Crash recovery and replica state reconciliation"
      - "Consistent transaction ordering under concurrent writes"
      - "Thread-per-session concurrent request handling"
      - "Load testing and latency benchmarking"
      - "Microservices architecture with failover routing"
    summary: >
      A fault-tolerant distributed trading platform built as a microservices architecture with
      three primary services: a Frontend service that routes requests and manages failover, a
      Catalog service managing stock data with thread-safe updates, and an Order service
      replicated across 3 nodes using Paxos-based consensus (Prepare/Promise/Accept/Learn phases)
      to keep transaction ordering consistent under concurrent writes and partial failures, with
      automatic leader re-election on crash detection. Fault tolerance was validated through
      explicit failure simulations — leader kill, random replica failure, and mid-trade network
      partition — plus replica sync tests confirming correct write recovery after restart. Uses
      a ThreadPoolExecutor for thread-per-session concurrency and an LRU cache layer with latency
      benchmarking, deployed on Docker Compose and load-tested on AWS. Demonstrates hands-on
      implementation of a classic distributed consensus algorithm and the operational discipline
      of testing failure modes rather than just the happy path.

  - name: "Database Storage Engine"
    url: "https://github.com/ShireenMeher/database_engine"
    languages: ["Java"]
    tech_stack: ["Maven", "JDK 17"]
    concepts:
      - "Buffer pool management with LRU eviction"
      - "B+ tree indexing with sibling pointers for range scans"
      - "Volcano-model (iterator-style) query executor (open/next/close)"
      - "Block Nested Loop joins"
      - "Materialized projections / temporary tables"
      - "I/O cost analysis across buffer sizes"
      - "Fixed-length record serialization with schema-driven layout"
      - "Disk I/O via constant-time random access (pageId x PAGE_SIZE)"
      - "Database internals / storage engine design"
    summary: >
      A relational database storage engine built from scratch in Java, implementing a four-layer
      architecture: an application layer (dataset loader), an index layer (B+ tree for O(log f N)
      point and range queries via leaf sibling pointers), a buffer manager coordinating page
      movement between memory and disk with LRU eviction (only pages with a zero pin count are
      evictable; dirty pages flush before removal), and a page/disk layer handling fixed
      4096-byte page I/O. Includes a volcano-model query executor exposing iterator-style
      open/next/close operators, supporting Block Nested Loop joins and materialized projections
      across multiple tables, plus I/O cost analysis across different buffer sizes. Backed by
      comprehensive unit tests covering buffer management, disk operations, and query execution.
      Demonstrates real understanding of how relational databases work internally — the kind of
      systems-level knowledge relevant to backend, infrastructure, and database-adjacent roles.

  - name: "Grounded Entity Search"
    url: "https://github.com/ShireenMeher/grounded_entity_search"
    dates: "Jan 2026 - Apr 2026"
    languages: ["Python", "JavaScript"]
    tech_stack: ["FastAPI", "Uvicorn", "OpenAI GPT-4o-mini", "React", "Node.js", "SerpAPI", "trafilatura", "ThreadPoolExecutor", "Render", "Vercel"]
    concepts:
      - "LLM-based structured extraction"
      - "Retrieval-augmented / source-grounded generation"
      - "Hallucination detection (verbatim substring verification of evidence)"
      - "Dynamic schema generation per query"
      - "Multi-query search and result deduplication"
      - "Parallel web scraping and text extraction"
      - "Multi-signal ranking (completeness, corroboration, relevance, authority)"
      - "Cost and latency optimization for LLM pipelines"
      - "Type-aware entity deduplication"
      - "Production monitoring (per-stage timings, token cost tracking, failure rates)"
    summary: >
      A system that turns natural-language queries like "AI startups in healthcare" into
      structured, source-grounded entity tables with evidence links back to the web pages that
      support each field. Implements an 8-stage pipeline: query classification and dynamic
      schema generation via LLM, multi-query search with parallel SerpAPI calls and URL
      deduplication, low-latency snippet pre-ranking before committing scrape budget, parallel
      scraping and text extraction via trafilatura, parallel GPT-4o-mini extraction calls per
      page against a dynamically generated JSON schema, hallucination detection that verifies
      every piece of extracted evidence is a verbatim substring of the source text, entity
      deduplication/merging across sources, and multi-signal ranking across 8 dimensions.
      Parallelization brought end-to-end latency from ~140s sequential to 30-40s. Reports
      ~97% evidence verification rate (3% hallucination rate) and ~82% scrape success rate in
      production use. Backend on FastAPI/Render, frontend on React/Vercel. Demonstrates applied
      LLM system design with a real focus on grounding, verification, and cost/latency tradeoffs
      rather than a naive prompt-and-hope pipeline.

